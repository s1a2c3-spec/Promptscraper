<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Promptscaper</title>
<meta name="description" content="Log in to Promptscaper to optimize prompts and verify AI answers.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a href="index.html" class="logo"><img src="logo.png" alt="" class="logo-img">Promptscaper</a>
    <nav class="nav-links">
      <a href="index.html#how">How it works</a>
      <a href="pricing.html">Pricing</a>
      <a href="signup.html" class="nav-login">Sign up</a>
      <a href="signup.html" class="btn btn-small">Try it free</a>
    </nav>
    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main class="auth-main">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to keep optimizing prompts and verifying answers.</p>

    <button type="button" class="btn btn-google" id="google-login">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-divider"><span>or</span></div>

    <form id="login-form" class="auth-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">

      <p class="auth-error" id="auth-error" hidden></p>

      <button type="submit" class="btn btn-primary btn-full">Log in</button>
    </form>

    <p class="auth-footer">Don't have an account? <a href="signup.html">Sign up free</a></p>
  </div>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <span class="logo"><img src="logo.png" alt="" class="logo-img">Promptscaper</span>
    <p>Built for people who use AI every day and want to trust what it tells them.</p>
    <div class="footer-legal-links">
      <a href="terms.html">Terms</a>
      <a href="privacy.html">Privacy</a>
      <a href="refund.html">Refunds</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="script.js"></script>
<script src="auth.js"></script>
</body>
</html>
